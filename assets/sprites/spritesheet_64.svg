<?xml version="1.0" encoding="utf-8"?>
<!-- assets/sprites/spritesheet_64.svg - 2 rows x 6 cols, frames 64x64, Sana top row, Abdullah bottom -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="128" viewBox="0 0 384 128">
  <rect width="100%" height="100%" fill="transparent" />
  <!-- grid -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="transparent" />
      <path d="M64 0 L64 64" stroke="#ddd" stroke-width="0.6" />
      <path d="M0 64 L64 64" stroke="#ddd" stroke-width="0.6" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Top row: Sana (6 frames) -->
  <!-- simplified 16-bit blocky sprites for placeholder (customize later) -->
  <g id="sana_base" transform="translate(0,0)">
    <rect x="10" y="6" width="20" height="10" fill="#111" rx="2" />
    <rect x="8" y="16" width="28" height="20" fill="#ffd7c9" rx="2" />
    <rect x="6" y="36" width="32" height="22" fill="#ff66b2" rx="2" />
    <rect x="8" y="54" width="10" height="18" fill="#ff3fa6" rx="2" />
    <rect x="24" y="58" width="10" height="14" fill="#fff" rx="2" />
  </g>
  <!-- replicate with slight shifts across 6 frames -->
  <g transform="translate(64,0)"><use href="#sana_base" /><rect x="8" y="54" width="10" height="14" fill="#ff3fa6" /></g>
  <g transform="translate(128,0)"><use href="#sana_base" /><rect x="24" y="54" width="10" height="14" fill="#ff3fa6" /></g>
  <g transform="translate(192,0)"><use href="#sana_base" /><rect x="8" y="50" width="10" height="18" fill="#ff3fa6" /></g>
  <g transform="translate(256,0)"><use href="#sana_base" /><rect x="24" y="50" width="10" height="18" fill="#fff" /></g>
  <g transform="translate(320,0)"><use href="#sana_base" /><rect x="10" y="56" width="10" height="12" fill="#ff3fa6" /></g>

  <!-- Bottom row: Abdullah -->
  <g id="abd_base" transform="translate(0,64)">
    <rect x="8" y="6" width="28" height="10" fill="#111" rx="2" />
    <rect x="6" y="16" width="32" height="20" fill="#ffd7c9" rx="2" />
    <rect x="6" y="36" width="32" height="22" fill="#1fe0ff" rx="2" />
    <rect x="8" y="54" width="10" height="18" fill="#0a2a3a" rx="2" />
    <rect x="24" y="58" width="10" height="14" fill="#0a2a3a" rx="2" />
  </g>
  <g transform="translate(64,64)"><use href="#abd_base" /><rect x="8" y="54" width="10" height="14" fill="#0a2a3a" /></g>
  <g transform="translate(128,64)"><use href="#abd_base" /><rect x="24" y="54" width="10" height="14" fill="#0a2a3a" /></g>
  <g transform="translate(192,64)"><use href="#abd_base" /><rect x="8" y="50" width="10" height="18" fill="#0a2a3a" /></g>
  <g transform="translate(256,64)"><use href="#abd_base" /><rect x="24" y="50" width="10" height="18" fill="#0a2a3a" /></g>
  <g transform="translate(320,64)"><use href="#abd_base" /><rect x="10" y="56" width="10" height="12" fill="#0a2a3a" /></g>
</svg>
